name: 自動更新新聞

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "update_news.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet feedparser

      - name: Run update script
        run: python update_news.py

      - name: Commit & Push if changed
        run: |
          git config user.name "L News Bot"
          git config user.email "bot@lnewshk.local"
          git add content.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 自動更新新聞 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "✅ 已推送最新新聞"
          fi
