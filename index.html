<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L News — 獨立新聞觀察</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5EEE1;
    --surface: #FFFCF5;
    --surface-alt: #EFE6D3;
    --ink: #2C2620;
    --ink-soft: #6E6355;
    --ink-faint: #9A907E;
    --line: #E2D7C2;
    --teal: #3F7C74;
    --teal-dim: rgba(63,124,116,0.1);
    --coral: #E2795A;
    --coral-dim: rgba(226,121,90,0.12);
    --gold: #C99A3D;
    --gold-dim: rgba(201,154,61,0.14);
    --plum: #8B5C7E;
    --plum-dim: rgba(139,92,126,0.12);
    --sky: #4E7FA0;
    --sky-dim: rgba(78,127,160,0.12);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }
  html{ scroll-behavior: smooth; }

  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    line-height: 1.55;
    min-height: 100vh;
  }

  .wrap{ max-width: 1160px; margin: 0 auto; padding: 0 28px 90px; }

  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding: 34px 0 28px;
  }
  .brand{ display:flex; align-items:center; gap: 18px; }
  .logo-mark{
    width: 78px; height: 78px;
    border-radius: 20px;
    background: var(--ink);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    overflow: hidden;
  }
  .logo-mark img{ width: 82%; height: 82%; object-fit: contain; }
  .brand-text h1{
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .brand-text p{
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 3px;
  }
  .nav-right{
    display:flex; align-items:center; gap: 14px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .byline-pill{
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 8px 14px;
    border-radius: 999px;
  }

  .hero{
    margin-top: 12px;
    display:grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 40px;
    align-items:center;
  }
  .hero-art{
    background: linear-gradient(155deg, #E9DCC3, #DCC9A8);
    border-radius: 26px;
    aspect-ratio: 4/3.1;
    position: relative;
    overflow: hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .hero-art svg{ width: 78%; height: 78%; }
  .hero-art img{ width:100%; height:100%; object-fit:cover; }
  .hero-copy .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--coral);
    background: var(--coral-dim);
    padding: 6px 13px;
    border-radius: 999px;
  }
  .hero-copy h2{
    font-family:'Fraunces', serif;
    font-size: 38px;
    font-weight: 600;
    line-height: 1.28;
    margin-top: 18px;
    max-width: 480px;
  }
  .brush-underline{
    display:block;
    width: 130px;
    height: 14px;
    margin-top: 4px;
    opacity: 0.85;
  }
  .hero-copy p.summary{
    margin-top: 16px;
    color: var(--ink-soft);
    font-size: 16px;
    max-width: 460px;
  }
  .hero-meta{
    display:flex; align-items:center; gap: 16px;
    margin-top: 22px;
    font-size: 13px;
    color: var(--ink-faint);
  }
  .hero-meta .dot{ width:4px; height:4px; border-radius:50%; background: var(--ink-faint); }
  .hero-btn{
    display:inline-flex; align-items:center; gap:8px;
    margin-top: 24px;
    background: var(--ink);
    color: var(--surface);
    font-weight: 600;
    font-size: 14.5px;
    padding: 13px 22px;
    border-radius: 999px;
    border:none;
    cursor:pointer;
    text-decoration:none;
    transition: transform .15s ease, opacity .15s ease;
  }
  .hero-btn:hover{ transform: translateY(-1px); opacity: 0.88; }

  .tabs{
    display:flex; gap: 10px;
    margin-top: 58px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }
  .tab{
    font-family: 'Work Sans', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .18s ease;
  }
  .tab:hover{ border-color: var(--ink-faint); color: var(--ink); }
  .tab.active{
    background: var(--ink);
    border-color: var(--ink);
    color: var(--surface);
  }
  .live-badge{
    display:inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: #22c55e;
    color: white;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 6px;
    vertical-align: middle;
    animation: pulse 2s infinite;
  }
  .tab.active .live-badge{
    background: #4ade80;
    color: #052e16;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 26px;
  }
  .card{
    background: var(--surface);
    border-radius: 20px;
    overflow: hidden;
    display:flex; flex-direction:column;
    box-shadow: 0 1px 2px rgba(44,38,32,0.04);
    transition: transform .2s ease, box-shadow .2s ease;
    animation: rise .4s ease both;
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .card:hover{
    transform: translateY(-4px);
    box-shadow: 0 14px 28px rgba(44,38,32,0.09);
  }
  .card-art{
    aspect-ratio: 16/10;
    display:flex; align-items:center; justify-content:center;
    position: relative;
    overflow: hidden;
  }
  .card-art svg{ width: 56%; height: 56%; }
  .card-art img{ width:100%; height:100%; object-fit:cover; }
  .card-body{ padding: 20px 22px 22px; display:flex; flex-direction:column; flex-grow:1; }
  .card-top{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .cat-tag{
    font-size: 11.5px;
    font-weight: 700;
    padding: 4px 11px;
    border-radius: 999px;
  }
  .cat-tag.hk{ color: var(--teal); background: var(--teal-dim); }
  .cat-tag.world{ color: var(--sky); background: var(--sky-dim); }
  .cat-tag.fun{ color: var(--gold); background: var(--gold-dim); }
  .cat-tag.stock{ color: #4C8A5E; background: rgba(76,138,94,0.12); }
  .cat-tag.football{ color: var(--plum); background: var(--plum-dim); }

  .time{ font-size: 12px; color: var(--ink-faint); }

  .card h3{
    font-family:'Fraunces', serif;
    font-size: 18.5px;
    font-weight: 600;
    line-height: 1.42;
    margin-bottom: 10px;
  }
  .card p.excerpt{
    color: var(--ink-soft);
    font-size: 13.5px;
    line-height: 1.65;
    flex-grow: 1;
    margin-bottom: 18px;
  }
  .card-footer{
    display:flex; align-items:center; justify-content:space-between;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .source-label{ font-size: 12px; color: var(--ink-faint); }
  .read-link{
    display:inline-flex; align-items:center; gap:5px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    text-decoration: none;
  }
  .read-link svg{ width:13px; height:13px; transition: transform .15s ease; }
  .read-link:hover svg{ transform: translateX(3px); }

  .analysis-badge{
    display:inline-flex; align-items:center; gap:5px;
    font-size: 11px;
    font-weight: 600;
    color: var(--coral);
  }
  .analysis-badge::before{ content:"✎"; font-size: 11px; }

  footer{
    margin-top: 64px;
    padding-top: 26px;
    border-top: 1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
    color: var(--ink-faint);
    font-size: 12.5px;
    flex-wrap: wrap;
    gap: 10px;
  }
  footer a{ color: var(--ink-faint); }

  @media (max-width: 940px){
    .hero{ grid-template-columns: 1fr; }
    .grid{ grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 620px){
    .grid{ grid-template-columns: 1fr; }
    .hero-copy h2{ font-size: 28px; }
    .wrap{ padding: 0 18px 60px; }
    nav{ flex-wrap: wrap; gap: 16px; }
    .logo-mark{ width: 64px; height:64px; }
  }

  :focus-visible{ outline: 2px solid var(--coral); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>

<script>
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  const ART = {
    hk: `<svg viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">

          <path d="M40 60 Q80 20 120 90" stroke="#2C2620" stroke-width="2" fill="none" opacity="0.25" stroke-dasharray="4 5"/>
        </svg>`,
    stock: `<svg viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg">
          <polyline points="15,95 45,70 70,80 100,35 130,50 145,20" fill="none" stroke="#4C8A5E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

        </svg>`,
    football: `<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
          <circle cx="80" cy="80" r="52" fill="none" stroke="#8B5C7E" stroke-width="3"/>
          <polygon points="80,55 95,66 89,84 71,84 65,66" fill="#8B5C7E"/>
          <line x1="80" y1="28" x2="80" y2="55" stroke="#8B5C7E" stroke-width="2.5"/>

          <line x1="28" y1="80" x2="65" y2="66" stroke="#8B5C7E" stroke-width="2.5"/>
        </svg>`
  };
  const ART_BG = { hk: '#E9DCC3', world: '#DFE7E9', fun: '#F3E7CE', stock: '#DEEBDF', football: '#EBE0E6' };
  const CAT_LABEL = { hk: '香港', world: '世界', fun: '趣聞', stock: '美股', football: '足球' };

  let CONTENT = null;
  let currentTab = 'hk';

  function renderHero(hero){
    document.getElementById('hero-eyebrow').textContent = hero.eyebrow || '';
    document.getElementById('hero-title').textContent = hero.title || '';
    document.getElementById('hero-summary').textContent = hero.summary || '';
    document.getElementById('hero-time').textContent = hero.time || '';
    document.getElementById('hero-source').textContent = hero.source ? ('來源：' + hero.source) : '';
    const art = document.getElementById('hero-art');
    if(hero.image){
      art.innerHTML = `<img src="${hero.image}" alt="">`;
    } else {
      art.innerHTML = ART.world;
    }
    const btnWrap = document.getElementById('hero-btn-wrap');
    if(hero.link){
      btnWrap.innerHTML = `<a class="hero-btn" href="${hero.link}" target="_blank" rel="noopener">閱讀完整報導 ${ARROW}</a>`;
    } else {
      btnWrap.innerHTML = '';
    }
  }

  function renderCards(cat){
    currentTab = cat;
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty-state');
    grid.innerHTML = '';
    const items = (CONTENT.categories[cat] || []);
    if(items.length === 0){
      grid.style.display = 'none';
      empty.style.display = 'block';
      return;
    }
    grid.style.display = 'grid';
    empty.style.display = 'none';
    items.forEach((item, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = (i * 0.06) + 's';
      const analysisTag = item.analysis ? '<span class="analysis-badge">署名分析</span>' : '';
      const artHtml = item.image
        ? `<img src="${item.image}" alt="">`
        : ART[cat];
      const linkBtn = item.link
        ? `<a class="read-link" href="${item.link}" target="_blank" rel="noopener">${item.analysis ? '閱讀全文' : '閱讀原文'} ${ARROW}</a>`
        : '';
      card.innerHTML = `
        <div class="card-art" style="background:${ART_BG[cat]}">${artHtml}</div>
        <div class="card-body">
          <div class="card-top">
            <span class="cat-tag ${cat}">${CAT_LABEL[cat]}</span>
            ${analysisTag}
            <span class="time" style="margin-left:auto">${item.time || ''}</span>
          </div>
          <h3>${item.title || ''}</h3>
          <p class="excerpt">${item.summary || ''}</p>
          <div class="card-footer">
            <span class="source-label">${item.source || ''}</span>
            ${linkBtn}
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  document.getElementById('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab');
    if(!btn) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderCards(btn.dataset.cat);
  });

  fetch('./content.json?_=' + Date.now())
    .then(res => res.json())
    .then(data => {
      CONTENT = data;
      renderHero(data.hero || {});
      renderCards('hk');
      // 顯示大概更新時間
      const now = new Date();
      const opts = { hour: '2-digit', minute: '2-digit', hour12: false };
      document.getElementById('last-update').textContent = 
        `自動更新（每2小時）· 本地載入 ${now.toLocaleTimeString('zh-HK', opts)}`;
    })
    .catch(err => {
      document.getElementById('hero-title').textContent = '內容載入失敗，請稍後重試';
      console.error(err);
    });
</script>

</body>
</html>
