<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L News — 轉載 X 重要貼文</title>
<link rel="icon" href="LOGO.jpeg" type="image/jpeg">
<link rel="apple-touch-icon" href="LOGO.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5EEE1;
    --surface: #FFFCF5;
    --surface-alt: #EFE6D3;
    --ink: #2C2620;
    --ink-soft: #6E6355;
    --ink-faint: #9A907E;
    --line: #E2D7C2;
    --teal: #3F7C74;
    --teal-dim: rgba(63,124,116,0.1);
    --coral: #E2795A;
    --coral-dim: rgba(226,121,90,0.12);
    --gold: #C99A3D;
    --gold-dim: rgba(201,154,61,0.14);
    --plum: #8B5C7E;
    --plum-dim: rgba(139,92,126,0.12);
    --sky: #4E7FA0;
    --sky-dim: rgba(78,127,160,0.12);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }
  html{ scroll-behavior: smooth; }

  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    line-height: 1.55;
    min-height: 100vh;
  }

  .wrap{ max-width: 1160px; margin: 0 auto; padding: 0 28px 90px; }

  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding: 34px 0 28px;
  }
  .brand{ display:flex; align-items:center; gap: 18px; }
  .logo-mark{
    width: 78px; height: 78px;
    border-radius: 20px;
    background: #0a0a0a;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    overflow: hidden;
  }
  .logo-mark img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .brand-text h1{
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .brand-text p{
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 3px;
  }
  .nav-right{
    display:flex; align-items:center; gap: 14px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .byline-pill{
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 8px 14px;
    border-radius: 999px;
  }

  .site-banner{
    display:flex; align-items:flex-start; gap: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 8px;
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.55;
  }
  .site-banner strong{ color: var(--ink); font-weight: 600; }
  .site-banner .banner-icon{
    flex-shrink:0;
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--coral-dim);
    color: var(--coral);
    display:flex; align-items:center; justify-content:center;
    font-size: 14px; font-weight: 700;
  }

  .hero{
    margin-top: 18px;
    display:grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 40px;
    align-items:center;
  }
  .hero-art{
    background: linear-gradient(155deg, #E9DCC3, #DCC9A8);
    border-radius: 26px;
    aspect-ratio: 4/3.1;
    position: relative;
    overflow: hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .hero-art svg{ width: 78%; height: 78%; }
  .hero-art img{ width:100%; height:100%; object-fit:cover; }
  .hero-copy .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--coral);
    background: var(--coral-dim);
    padding: 6px 13px;
    border-radius: 999px;
  }
  .hero-copy h2{
    font-family:'Fraunces', serif;
    font-size: 38px;
    font-weight: 600;
    line-height: 1.28;
    margin-top: 18px;
    max-width: 480px;
  }
  .brush-underline{
    display:block;
    width: 130px;
    height: 14px;
    margin-top: 4px;
    opacity: 0.85;
  }
  .hero-copy p.summary{
    margin-top: 16px;
    color: var(--ink-soft);
    font-size: 16px;
    max-width: 460px;
    white-space: pre-line;
  }
  .hero-meta{
    display:flex; align-items:center; gap: 16px;
    margin-top: 22px;
    font-size: 13px;
    color: var(--ink-faint);
  }
  .hero-meta .dot{ width:4px; height:4px; border-radius:50%; background: var(--ink-faint); }
  .hero-btn{
    display:inline-flex; align-items:center; gap:8px;
    margin-top: 24px;
    background: var(--ink);
    color: var(--surface);
    font-weight: 600;
    font-size: 14.5px;
    padding: 13px 22px;
    border-radius: 999px;
    border:none;
    cursor:pointer;
    text-decoration:none;
    transition: transform .15s ease, opacity .15s ease;
  }
  .hero-btn:hover{ transform: translateY(-1px); opacity: 0.88; }

  .tabs{
    display:flex; gap: 10px;
    margin-top: 58px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }
  .tab{
    font-family: 'Work Sans', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .18s ease;
  }
  .tab:hover{ border-color: var(--ink-faint); color: var(--ink); }
  .tab.active{
    background: var(--ink);
    border-color: var(--ink);
    color: var(--surface);
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 26px;
  }

  /* —— X 貼文卡片 —— */
  .card{
    background: var(--surface);
    border-radius: 20px;
    overflow: hidden;
    display:flex; flex-direction:column;
    box-shadow: 0 1px 2px rgba(44,38,32,0.04);
    transition: transform .2s ease, box-shadow .2s ease;
    animation: rise .4s ease both;
    border: 1px solid transparent;
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .card:hover{
    transform: translateY(-4px);
    box-shadow: 0 14px 28px rgba(44,38,32,0.09);
    border-color: var(--line);
  }
  .card-body{
    padding: 20px 22px 18px;
    display:flex; flex-direction:column;
    flex-grow:1;
  }
  .card-top{
    display:flex; align-items:center; gap:10px;
    margin-bottom: 14px;
  }
  .cat-tag{
    font-size: 11.5px;
    font-weight: 700;
    padding: 4px 11px;
    border-radius: 999px;
  }
  .cat-tag.hk{ color: var(--teal); background: var(--teal-dim); }
  .cat-tag.world{ color: var(--sky); background: var(--sky-dim); }
  .cat-tag.fun{ color: var(--gold); background: var(--gold-dim); }
  .cat-tag.stock{ color: #4C8A5E; background: rgba(76,138,94,0.12); }
  .cat-tag.football{ color: var(--plum); background: var(--plum-dim); }
  .repost-pill{
    font-size: 11px;
    font-weight: 600;
    color: var(--coral);
    background: var(--coral-dim);
    padding: 4px 10px;
    border-radius: 999px;
  }
  .time{ font-size: 12px; color: var(--ink-faint); margin-left: auto; }

  .author-row{
    display:flex; align-items:center; gap: 12px;
    margin-bottom: 14px;
  }
  .avatar{
    width: 44px; height: 44px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--surface-alt);
    flex-shrink: 0;
    border: 1px solid var(--line);
  }
  .avatar-fallback{
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--surface);
    display:flex; align-items:center; justify-content:center;
    font-weight: 700; font-size: 16px;
    flex-shrink: 0;
  }
  .author-meta{ min-width: 0; }
  .author-name{
    font-weight: 700;
    font-size: 14.5px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .author-handle{
    font-size: 13px;
    color: var(--ink-faint);
    text-decoration: none;
  }
  .author-handle:hover{ color: var(--teal); text-decoration: underline; }

  .card h3{
    font-family:'Fraunces', serif;
    font-size: 17.5px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 10px;
  }
  .card p.translation{
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.7;
    flex-grow: 1;
    margin-bottom: 16px;
    white-space: pre-line;
  }
  .card-note{
    font-size: 12.5px;
    color: var(--ink-faint);
    background: var(--surface-alt);
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .card-note::before{
    content: "本站補充 · ";
    font-weight: 600;
    color: var(--ink-soft);
  }
  .card-footer{
    display:flex; align-items:center; justify-content:space-between;
    gap: 10px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    margin-top: auto;
  }
  .source-label{
    font-size: 12px;
    color: var(--ink-faint);
    display:inline-flex;
    align-items:center;
    gap: 5px;
  }
  .source-label svg{ width: 14px; height: 14px; opacity: 0.7; }
  .read-link{
    display:inline-flex; align-items:center; gap:5px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    text-decoration: none;
    white-space: nowrap;
  }
  .read-link svg{ width:13px; height:13px; transition: transform .15s ease; }
  .read-link:hover svg{ transform: translateX(3px); }

  footer{
    margin-top: 64px;
    padding-top: 26px;
    border-top: 1px solid var(--line);
    display:flex; justify-content:space-between; align-items:flex-start;
    color: var(--ink-faint);
    font-size: 12.5px;
    flex-wrap: wrap;
    gap: 12px;
  }
  footer a{ color: var(--ink-faint); }
  footer .disclaimer{
    max-width: 520px;
    line-height: 1.5;
  }

  @media (max-width: 940px){
    .hero{ grid-template-columns: 1fr; }
    .grid{ grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 620px){
    .grid{ grid-template-columns: 1fr; }
    .hero-copy h2{ font-size: 28px; }
    .wrap{ padding: 0 18px 60px; }
    nav{ flex-wrap: wrap; gap: 16px; }
    .logo-mark{ width: 64px; height:64px; font-size: 30px; }
  }

  :focus-visible{ outline: 2px solid var(--coral); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">

  <nav>
    <div class="brand">
      <div class="logo-mark" id="logo-mark">
        <img src="LOGO.jpeg" alt="L News logo" width="78" height="78">
      </div>
      <div class="brand-text">
        <h1>L News</h1>
        <p id="site-tagline">轉載 X 上的重要貼文 · 附中文翻譯</p>
      </div>
    </div>
    <div class="nav-right">
      <span class="byline-pill">轉載 · 非原創</span>
    </div>
  </nav>

  <div class="site-banner" role="note">
    <span class="banner-icon">X</span>
    <div>
      <strong>本站以轉載 X（Twitter）重要貼文為主。</strong>
      每則均標示原作者與原文連結，並附上中文翻譯，絕不當成自己的原創報導。
    </div>
  </div>

  <section class="hero" id="hero">
    <div class="hero-art" id="hero-art"></div>
    <div class="hero-copy">
      <span class="eyebrow" id="hero-eyebrow">載入中</span>
      <h2 id="hero-title">載入中…</h2>
      <svg class="brush-underline" viewBox="0 0 130 14"><path d="M2 9 C 30 3, 70 12, 128 6" stroke="#E2795A" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
      <p class="summary" id="hero-summary"></p>
      <div class="hero-meta">
        <span id="hero-time"></span>
        <span class="dot" id="hero-dot"></span>
        <span id="hero-source"></span>
      </div>
      <div id="hero-btn-wrap"></div>
    </div>
  </section>

  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="hk">香港</button>
    <button class="tab" data-cat="world">世界</button>
    <button class="tab" data-cat="fun">趣聞</button>
    <button class="tab" data-cat="stock">美股</button>
    <button class="tab" data-cat="football">足球</button>
  </div>

  <div class="grid" id="grid"></div>
  <div id="empty-state" style="display:none; text-align:center; padding:60px 20px; color:var(--ink-soft);">
    <p style="font-size:18px; margin-bottom:8px;">此分類暫時未有貼文</p>
    <p style="font-size:14px;">請用 editor.html 手動加入轉載的 X 貼文</p>
  </div>

  <footer>
    <div class="disclaimer" id="footer-disclaimer">
      L News © 2026 · 本站內容為轉載與中文翻譯，非原創報導。版權歸原作者所有。
    </div>
    <span id="last-update">手動更新 · GitHub Pages</span>
  </footer>

</div>

<script>
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const X_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.727-8.835L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/></svg>';

  const ART = {
    world: `<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
          <circle cx="80" cy="80" r="55" fill="none" stroke="#4E7FA0" stroke-width="3"/>
          <ellipse cx="80" cy="80" rx="55" ry="22" fill="none" stroke="#4E7FA0" stroke-width="2.5" opacity="0.7"/>
          <ellipse cx="80" cy="80" rx="22" ry="55" fill="none" stroke="#4E7FA0" stroke-width="2.5" opacity="0.7"/>
          <line x1="25" y1="80" x2="135" y2="80" stroke="#4E7FA0" stroke-width="2.5" opacity="0.7"/>
        </svg>`
  };
  const CAT_LABEL = { hk: '香港', world: '世界', fun: '趣聞', stock: '美股', football: '足球' };

  let CONTENT = null;

  function esc(str){
    return String(str ?? '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function initialOf(name){
    const s = (name || '?').trim();
    return s ? s.charAt(0).toUpperCase() : '?';
  }

  function renderHero(hero){
    hero = hero || {};
    document.getElementById('hero-eyebrow').textContent = hero.eyebrow || '';
    document.getElementById('hero-title').textContent = hero.title || '';
    document.getElementById('hero-summary').textContent = hero.summary || '';
    document.getElementById('hero-time').textContent = hero.time || '';
    const src = hero.source || '';
    document.getElementById('hero-source').textContent = src ? ('來源：' + src) : '';
    document.getElementById('hero-dot').style.display = (hero.time && src) ? '' : 'none';
    const art = document.getElementById('hero-art');
    if(hero.image){
      art.innerHTML = `<img src="${esc(hero.image)}" alt="">`;
    } else {
      art.innerHTML = ART.world;
    }
    const btnWrap = document.getElementById('hero-btn-wrap');
    if(hero.link){
      btnWrap.innerHTML = `<a class="hero-btn" href="${esc(hero.link)}" target="_blank" rel="noopener noreferrer">查看連結 ${ARROW}</a>`;
    } else {
      btnWrap.innerHTML = '';
    }
  }

  function avatarHtml(item){
    if(item.author_avatar){
      return `<img class="avatar" src="${esc(item.author_avatar)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="avatar-fallback" style="display:none">${esc(initialOf(item.author_name))}</span>`;
    }
    return `<span class="avatar-fallback">${esc(initialOf(item.author_name))}</span>`;
  }

  function renderCards(cat){
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty-state');
    grid.innerHTML = '';
    const items = (CONTENT.categories && CONTENT.categories[cat]) || [];
    if(items.length === 0){
      grid.style.display = 'none';
      empty.style.display = 'block';
      return;
    }
    grid.style.display = 'grid';
    empty.style.display = 'none';

    items.forEach((item, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = (i * 0.06) + 's';

      const handle = (item.author_handle || '').replace(/^@/, '');
      const profileUrl = handle ? `https://x.com/${encodeURIComponent(handle)}` : '';
      const handleHtml = handle
        ? (profileUrl
            ? `<a class="author-handle" href="${esc(profileUrl)}" target="_blank" rel="noopener noreferrer">@${esc(handle)}</a>`
            : `<span class="author-handle">@${esc(handle)}</span>`)
        : '';

      const title = item.title
        ? `<h3>${esc(item.title)}</h3>`
        : '';
      const note = item.note
        ? `<div class="card-note">${esc(item.note)}</div>`
        : '';
      const xUrl = item.x_url || item.link || '';
      const linkBtn = xUrl
        ? `<a class="read-link" href="${esc(xUrl)}" target="_blank" rel="noopener noreferrer">查看原文 ${ARROW}</a>`
        : '';
      const attribution = item.attribution || '轉載自 X';

      card.innerHTML = `
        <div class="card-body">
          <div class="card-top">
            <span class="cat-tag ${cat}">${CAT_LABEL[cat] || cat}</span>
            <span class="repost-pill">轉載</span>
            <span class="time">${esc(item.time_display || item.time || '')}</span>
          </div>
          <div class="author-row">
            ${avatarHtml(item)}
            <div class="author-meta">
              <div class="author-name">${esc(item.author_name || '未知作者')}</div>
              ${handleHtml}
            </div>
          </div>
          ${title}
          <p class="translation">${esc(item.translation_zh || item.summary || '')}</p>
          ${note}
          <div class="card-footer">
            <span class="source-label">${X_ICON} ${esc(attribution)}</span>
            ${linkBtn}
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  document.getElementById('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab');
    if(!btn) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderCards(btn.dataset.cat);
  });

  fetch('./content.json?_=' + Date.now())
    .then(res => res.json())
    .then(data => {
      CONTENT = data;
      if(data.meta){
        if(data.meta.site_tagline){
          document.getElementById('site-tagline').textContent = data.meta.site_tagline;
        }
        if(data.meta.disclaimer){
          document.getElementById('footer-disclaimer').textContent =
            'L News © 2026 · ' + data.meta.disclaimer;
        }
      }
      renderHero(data.hero || {});
      renderCards('hk');
      const now = new Date();
      const opts = { hour: '2-digit', minute: '2-digit', hour12: false };
      let stamp = `手動更新 · 載入 ${now.toLocaleTimeString('zh-HK', opts)}`;
      if(data.meta && data.meta.updated_at){
        stamp = `內容更新：${data.meta.updated_at} · 載入 ${now.toLocaleTimeString('zh-HK', opts)}`;
      }
      document.getElementById('last-update').textContent = stamp;
    })
    .catch(err => {
      document.getElementById('hero-title').textContent = '內容載入失敗，請稍後重試';
      console.error(err);
    });
</script>

</body>
</html>
